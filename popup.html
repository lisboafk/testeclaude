<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>PNCP Filtros Avançados</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      color: #333;
      background: #f8f9fa;
    }
    .header {
      background: #1351b4;
      color: white;
      padding: 12px 16px;
    }
    .header h1 { font-size: 14px; font-weight: 700; }
    .header p  { font-size: 11px; opacity: 0.8; margin-top: 2px; }

    .section { padding: 14px 16px; background: white; border-bottom: 1px solid #eee; }
    .section h2 { font-size: 11px; font-weight: 700; text-transform: uppercase;
                  color: #888; letter-spacing: 0.5px; margin-bottom: 8px; }

    .btn-open {
      display: block;
      width: 100%;
      padding: 10px;
      background: #1351b4;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      transition: background 0.15s;
    }
    .btn-open:hover { background: #0c3a8a; }
    .btn-open:disabled { background: #999; cursor: not-allowed; }

    .not-pncp {
      text-align: center;
      padding: 4px 0 8px;
    }
    .not-pncp p { font-size: 12px; color: #666; margin-bottom: 10px; }
    .btn-go {
      display: inline-block;
      padding: 8px 16px;
      background: #1351b4;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
    }

    label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px; color: #555; }
    input[type="url"] {
      width: 100%;
      padding: 7px 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 12px;
      margin-bottom: 8px;
      outline: none;
    }
    input[type="url"]:focus { border-color: #1351b4; box-shadow: 0 0 0 2px rgba(19,81,180,0.12); }

    .hint { font-size: 11px; color: #888; line-height: 1.4; margin-bottom: 8px; }

    .btn-save {
      padding: 7px 14px;
      background: #e8f0fe;
      color: #1351b4;
      border: 1px solid #c5d8fc;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-save:hover { background: #d2e3fc; }

    .status { font-size: 11px; margin-top: 6px; color: #2e7d32; display: none; }

    .footer { padding: 8px 16px; font-size: 10px; color: #bbb; text-align: center; }
  </style>
</head>
<body>

  <div class="header">
    <h1>PNCP Filtros Avançados</h1>
    <p>Integração com Proposta Pronta</p>
  </div>

  <!-- On PNCP page -->
  <div class="section" id="sec-on-pncp" style="display:none">
    <h2>Painel de filtros</h2>
    <button class="btn-open" id="btn-open-panel">Abrir painel de filtros no PNCP</button>
  </div>

  <!-- Not on PNCP page -->
  <div class="section" id="sec-not-pncp" style="display:none">
    <div class="not-pncp">
      <p>Acesse o portal PNCP para usar os filtros avançados.</p>
      <a class="btn-go" href="https://pncp.gov.br/app/editais" target="_blank">Abrir PNCP</a>
    </div>
  </div>

  <!-- Webhook settings -->
  <div class="section">
    <h2>Integração Proposta Pronta</h2>
    <label>URL do Webhook</label>
    <input type="url" id="webhook-url" placeholder="https://seu-saas.com/api/webhook">
    <div class="hint">POST com os dados das oportunidades selecionadas.</div>
    <button class="btn-save" id="btn-save">Salvar</button>
    <div class="status" id="save-status">Configuração salva!</div>
  </div>

  <div class="footer">PNCP Filtros Avançados v1.0</div>

  <script src="popup.js"></script>
</body>
</html>
